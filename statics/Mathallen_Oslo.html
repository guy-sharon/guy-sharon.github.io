<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Taxi Destination</title>

<style>
    @page {
        size: A6;
        margin: 10mm;
    }

    html, body {
        height: 100%;
        margin: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .card {
        display:flex;
        flex-direction: column;
        justify-content: space-around;
        width: 100%;
        height: 95%;
        max-width: 100%;
        margin: 0;
        background: white;
        border-radius: 20px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        border: 3px solid #333;
        box-sizing: border-box;
    }

    .destination {
        font-size: 92px;
        font-weight: bold;
        line-height: 1.1;
        margin-bottom: 255px;
        color: #111;
    }

    .address {
        font-size: 68px;
        line-height: 1.4;
        color: #333;
        margin-bottom: 300px;
        font-weight: bold;
    }

    .instruction {
        background: #f0f0f0;
        border-radius: 12px;
        padding: 15px;
        font-size: 48px;
    }

    .pin {
        font-size: 40px;
        margin-bottom: 10px;
    }

    .header {
        font-size: 44px;
        margin-bottom: 15px;
    }

</style>
</head>

<body>

<div class="card">

    <div>
    <div class="header">
        🚕
    </div>

    <div class="destination">
        Mathallen Oslo
    </div>
    </div>
    
    <div class="address">
        Vulkan 5, 0178 Oslo
    </div>

    <div>
    <div class="pin">
        📍
    </div>

    <div class="instruction">
        Please take us here
    </div>
    </div>

</div>

</body>
</html>
