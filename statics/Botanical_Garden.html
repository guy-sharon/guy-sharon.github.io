<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Taxi Destination</title>

<style>
    @page {
        size: A6;
        margin: 10mm;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 20px;
    }

    .card {
        max-width: 500px;
        margin: auto;
        background: white;
        border-radius: 20px;
        padding: 35px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        border: 3px solid #333;
    }

    .destination {
        font-size: 42px;
        font-weight: bold;
        line-height: 1.1;
        margin-bottom: 25px;
        color: #111;
    }

    .address {
        font-size: 28px;
        line-height: 1.4;
        color: #333;
        margin-bottom: 30px;
        font-weight: bold;
    }

    .instruction {
        background: #f0f0f0;
        border-radius: 12px;
        padding: 15px;
        font-size: 18px;
    }

    .pin {
        font-size: 40px;
        margin-bottom: 10px;
    }

    .header {
        font-size: 44px;
        margin-bottom: 15px;
    }

</style>
</head>

<body>

<div class="card">

    <div class="header">
        🚕
    </div>

    <div class="destination">
        Botanical Garden
    </div>

    <div class="address">
        Sars' gate 10, 0562 Oslo
    </div>

    <div class="pin">
        📍
    </div>

    <div class="instruction">
        Please take us here
    </div>

</div>

</body>
</html>
