  <script>
        // Function to check user's location
        function open_navigation(destLat, destLng, mode, placeName, taxiPath) {
            if (mode === 'taxi') {
                window.location.href = taxiPath;
            } else if (mode === 'waze') {
                window.location.href = `https://waze.com/ul?ll=${destLat},${destLng}&navigate=yes`;
            } else {
                window.location.href = `https://www.google.com/maps/dir/?api=1&destination=${destLat},${destLng}&travelmode=walking`;
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radius of the Earth in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c; // Distance in km
            return distance;
        }

        function checkLocation(destLat, destLng, placeName, verified_locations, verify_dists_km, mode, taxiPath) {
            // Skip geolocation checks and immediately open the requested navigation/taxi view.
            open_navigation(destLat, destLng, mode, placeName, taxiPath);
        }
